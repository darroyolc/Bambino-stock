name: Stock Check

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-check
  cancel-in-progress: true

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Vigilar en bucle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          FIN=$(( $(date +%s) + 20100 ))
          while [ "$(date +%s)" -lt "$FIN" ]; do
            python bambino_stock_bot.py || echo "fallo, sigo"
            git add stock_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Actualizar estado [skip ci]"
              git pull --rebase origin main || true
              git push || true
            fi
            sleep 300
          done
